name: Bug report
description: The tool crashed, failed, or behaved differently from the documentation.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Issues are public. Remove secrets, tokens, and private code before you submit.
        For a wrong scan result, use the "False positive or wrong result" template.
        For a security vulnerability, do not open an issue. Follow SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands, in order. A small sample repository or file helps the most.
      placeholder: |
        1. agentgov scan . --profile standard --no-color
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant output. Use --no-color so it pastes cleanly. Remove secrets.
      render: text
  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: "0, 1, or 2. In PowerShell, run: $LASTEXITCODE. In bash or zsh, run: echo $?"
  - type: input
    id: version
    attributes:
      label: Output of agentgov version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed the tool
      options:
        - go install
        - Built from source
        - Release binary
        - GitHub Action
        - Other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of agentgov doctor
      description: Optional, but it often answers the first questions.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
