name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests
        run: go test ./...
      - name: Build
        shell: bash
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -o bin/agentgov ./cmd/agentgov
      - name: Governance tests of the safe example (Python, standard library only)
        shell: bash
        working-directory: examples/safe-agent
        run: python -m unittest discover -s tests/governance -t .
      - name: Smoke test, vulnerable example must be blocked (exit code 1)
        shell: bash
        run: |
          set +e
          bin/agentgov scan examples/vulnerable-agent --no-color
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit code 1 (policy failure), got $code"; exit 1; fi
      - name: Smoke test, safe example must not be blocked (exit code 0)
        shell: bash
        run: bin/agentgov scan examples/safe-agent --no-color --full
      - name: Smoke test, scan error is exit code 2
        shell: bash
        run: |
          set +e
          bin/agentgov scan does-not-exist
          code=$?
          if [ "$code" -ne 2 ]; then echo "expected exit code 2 (scan error), got $code"; exit 1; fi
      - name: All report formats render
        shell: bash
        run: |
          bin/agentgov scan examples/vulnerable-agent --fail-on never -q \
            --json-out out/results.json --sarif-out out/findings.sarif \
            --html-out out/report.html --markdown-out out/summary.md
          bin/agentgov report out/results.json --format markdown > /dev/null
          bin/agentgov compare out/results.json out/results.json --format markdown > /dev/null
          bin/agentgov doctor

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, check, and build
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the vulnerable example through the action
        id: vulnerable
        uses: ./
        with:
          path: examples/vulnerable-agent
          fail_on: never
          artifact_name: agentgov-vulnerable-example
      - name: Scan the safe example through the action
        id: safe
        uses: ./
        with:
          path: examples/safe-agent
          fail_on: block
          artifact_name: agentgov-safe-example
      - name: Check action outputs
        shell: bash
        env:
          V_DECISION: ${{ steps.vulnerable.outputs.decision }}
          V_FINDINGS: ${{ steps.vulnerable.outputs.findings }}
          V_JSON: ${{ steps.vulnerable.outputs.json }}
          S_DECISION: ${{ steps.safe.outputs.decision }}
        run: |
          set -euo pipefail
          echo "vulnerable: decision=$V_DECISION findings=$V_FINDINGS"
          echo "safe: decision=$S_DECISION"
          test "$V_DECISION" = "BLOCK"
          test "$V_FINDINGS" -gt 0
          test "$S_DECISION" != "BLOCK"
          test -s "$V_JSON"
