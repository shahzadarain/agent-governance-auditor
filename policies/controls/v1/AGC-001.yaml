id: AGC-001
title: Owner and Inventory
domain: "A: Accountability"
intent: >-
  Every agent needs an accountable owner, a stable identifier, a stated
  purpose, and an inventory of its tools and data. Without these, nobody can
  answer for what the agent does or decide whether it should keep running.
  A name in a file is a declaration, not proof that the owner exists or
  accepts the role.
plain_language: A named person or team must be responsible for the agent, and the agent must be listed with what it does and what it can use.
applicability:
  mode: always
  rationale: Every agent needs an accountable owner, whatever it can do.
evidence_types:
  - configuration
  - external-attestation
  - manual-review
detectors:
  - AGC-001.*
dynamic_tests: []
verification_rules:
  implementation: >-
    A static scan cannot reach this level. A reviewer or a registry record
    must confirm that the declared owner exists and accepts responsibility.
  tested: >-
    An independent check confirms the registry record, and the declared tool
    and data inventory matches what the scan detected, for this exact version.
  operational: >-
    A signed owner attestation or a verified registry record is current, and a
    periodic review with a named reviewer and date is on record.
  max_static_maturity: 1
remediation:
  - Add an agent section to .agentgov.yaml with an id, an owner, a description, and a purpose.
  - Register the agent in your organization's inventory and record the reference in registry_ref.
  - List every tool the agent may call under capabilities.declared_tools.
  - Record the reviewer and the date of the last review.
  - Ask the owner to sign an attestation and store it as evidence.
severity: high
default_weight: 5
standards_mappings:
  - standard: NIST AI Risk Management Framework
    version: "1.0"
    requirement_id: GOVERN
    url: https://airc.nist.gov/airmf-resources/airmf/5-sec-core/
    rationale: A named owner and an inventory entry are basic accountability structures for an AI system.
limitations:
  - A static scan reads the declared owner. It cannot confirm that the person or team exists or accepts the role.
  - The scan compares declared tools with detected tools. It cannot see tools that are loaded only at run time.
examples:
  positive: A signed attestation from the owning team that names the agent ID and is bound to the current commit.
  negative: A repository with agent code and no declared owner, identifier, or purpose.
