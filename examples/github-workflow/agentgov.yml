# Minimal AgentGov Auditor workflow.
# Copy this file to .github/workflows/agentgov.yml in your repository.
#
# The scan is read-only and offline. It does not run code from your repository
# and needs no account, API key, or secret.
# More options: integrations/github/README.md
name: AgentGov

on:
  # Use pull_request, not pull_request_target, so untrusted code never runs
  # with a privileged token.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Governance scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No release tag exists yet, so this example follows the main branch.
      # For production use, replace "main" with a full commit SHA that you
      # have reviewed.
      - name: Run AgentGov Auditor
        uses: shahzadarain/agent-governance-auditor@main
        with:
          path: "."
          fail_on: block
